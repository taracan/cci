{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="card" style="max-width: 450px; margin: 3rem auto;">
    <h2>Login</h2>
    <form method="POST">
        <div class="form-group">
            <label>Email</label>
            <input type="email" name="email" required placeholder="your@email.com">
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" name="password" required placeholder="Your password">
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%; padding: 0.8rem;">Login</button>
    </form>
    <p style="text-align: center; margin-top: 1rem; color: #6b7280;">
        Don't have an account? <a href="{{ url_for('public.register') }}">Register</a>
    </p>
</div>
{% endblock %}
