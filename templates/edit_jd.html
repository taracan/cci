{% extends "base.html" %}
{% block title %}Edit JD{% endblock %}
{% block content %}
<div class="card" style="max-width: 650px; margin: 2rem auto;">
    <h2>Edit Job Description</h2>
    <form method="POST">
        <div class="form-group">
            <label>Role Title *</label>
            <input type="text" name="role_title" required value="{{ jd.role_title }}">
        </div>
        <div class="form-group">
            <label>Company *</label>
            <input type="text" name="company" required value="{{ jd.company }}">
        </div>
        <div class="form-group">
            <label>Required Skills * (comma separated)</label>
            <input type="text" name="required_skills" required value="{{ jd.required_skills|join(', ') }}">
        </div>
        <div class="form-group">
            <label>Preferred Skills (comma separated)</label>
            <input type="text" name="preferred_skills" value="{{ jd.preferred_skills|join(', ') }}">
        </div>
        <div class="form-group">
            <label>Experience Required (years)</label>
            <input type="number" name="experience_years" min="0" max="30" value="{{ jd.experience_years }}">
        </div>
        <div class="form-group">
            <label>Location</label>
            <input type="text" name="location" value="{{ jd.location }}">
        </div>
        <div class="form-group">
            <label>Full Job Description *</label>
            <textarea name="jd_text" required>{{ jd.jd_text }}</textarea>
        </div>
        <div style="display: flex; gap: 1rem;">
            <button type="submit" class="btn btn-primary" style="flex: 1; padding: 0.8rem;">Save Changes</button>
            <a href="{{ url_for('admin.admin_dashboard') }}" class="btn btn-secondary" style="padding: 0.8rem;">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
