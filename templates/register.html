{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block content %}
<div class="card" style="max-width: 500px; margin: 2rem auto;">
    <h2>Create Account</h2>
    <form method="POST">
        <div class="form-group">
            <label>Full Name</label>
            <input type="text" name="name" required placeholder="John Doe">
        </div>
        <div class="form-group">
            <label>Email</label>
            <input type="email" name="email" required placeholder="john@example.com">
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" name="password" required minlength="6" placeholder="Min 6 characters">
        </div>
        <div class="form-group">
            <label>Role</label>
            <select name="role" id="roleSelect" onchange="toggleFields()">
                <option value="candidate">Candidate (Job Seeker)</option>
                <option value="admin">Admin (Recruiter)</option>
            </select>
        </div>
        <div class="form-group" id="targetRoleField">
            <label>Target Role</label>
            <input type="text" name="target_role" placeholder="e.g. Python Developer, ML Engineer">
        </div>
        <div class="form-group" id="adminKeyField" style="display:none;">
            <label>Admin Key</label>
            <input type="password" name="admin_key" placeholder="Enter admin secret key">
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%; padding: 0.8rem;">Register</button>
    </form>
    <p style="text-align: center; margin-top: 1rem; color: #6b7280;">
        Already have an account? <a href="{{ url_for('public.login') }}">Login</a>
    </p>
</div>
<script>
function toggleFields() {
    var role = document.getElementById('roleSelect').value;
    document.getElementById('targetRoleField').style.display = role === 'candidate' ? 'block' : 'none';
    document.getElementById('adminKeyField').style.display = role === 'admin' ? 'block' : 'none';
}
</script>
{% endblock %}
